name: MD to PDF
description: Render Markdown as a PDF with working heading links
inputs:
  input:
    description: Markdown file, relative to the repository root
    default: README.md
  output:
    description: Output PDF path, relative to the repository root
    default: document.pdf
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install renderer dependencies
      shell: bash
      run: npm install --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Install Chromium
      shell: bash
      run: '"$GITHUB_ACTION_PATH/node_modules/.bin/playwright" install --with-deps chromium'
    - name: Render PDF
      shell: bash
      env:
        MARKDOWN_INPUT: ${{ inputs.input }}
        PDF_OUTPUT: ${{ inputs.output }}
      run: node "$GITHUB_ACTION_PATH/render.cjs"
