name: Build example PDF

on:
  push:
    branches: [main]
    paths:
      - 'example/document.md'
      - 'example/figures/**'
      - 'action.yml'
      - 'render.cjs'
      - 'package.json'
      - '.github/workflows/example.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          input: example/document.md
          output: example/document.pdf
      - name: Commit and push example PDF
        run: |
          git add example/document.pdf
          if git diff --cached --quiet; then
            echo "Example PDF has not changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update example PDF'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: example-pdf
          path: example/document.pdf
          if-no-files-found: error
